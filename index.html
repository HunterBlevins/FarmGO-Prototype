<!doctype html>
<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="FarmGO: an agricultural data dashboard with county reports, raster datasets and field boundaries."
    />

    <!-- Browser tab icon --> 
     <link 
        rel="icon" 
        type="image/png" 
        href="%BASE_URL%FarmGOLogo.png" 
     />

    <title>
      FarmGO
    </title>

  </head>


  <body>

    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header id="topbar">

      <div class="brand">

        <img
          id="logo"
          src="%BASE_URL%FarmGOLogo.png"
          alt="FarmGO logo"
        />

        <div>

          <h1 id="appTitle">
            FarmGO
          </h1>

          <div id="appSubtitle">
            Agricultural data dashboard
          </div>

        </div>

      </div>

    </header>


    <!-- =====================================================
         APPLICATION
         ===================================================== -->

    <main id="app">


      <!-- ===================================================
           LEFT PANEL
           =================================================== -->

      <aside
        id="leftPanel"
        class="side-panel"
      >

        <div
          class="resize-handle"
          id="leftResizeHandle"
          title="Drag to resize"
        ></div>


        <!-- ================================================
             LOCATION + FIELD LAYER
             ================================================ -->

        <section class="panel-section">

          <h2>
            Location
          </h2>


          <label for="stateSelect">
            State
          </label>


          <select id="stateSelect">

            <option value="">
              Select a state...
            </option>

          </select>


          <label for="countySelect">
            County
          </label>


          <select
            id="countySelect"
            disabled
          >

            <option value="">
              Select a county...
            </option>

          </select>


          <!-- ==============================================
               FIELD LAYER
               ============================================== -->

          <label for="fieldLayerSelect">
            Field Layer
          </label>


          <select
            id="fieldLayerSelect"
            disabled
          >

            <option value="">
              Select a county first...
            </option>

          </select>


          <div
            id="fieldLayerNote"
            class="empty-state field-layer-note"
            role="status"
            hidden
          ></div>


          <!-- ==============================================
               FIELD TRANSPARENCY
               ============================================== -->

          <div
            id="fieldOpacityControl"
            class="field-opacity-control"
          >

            <div class="opacity-header">

              <span>
                Transparency
              </span>

              <span id="fieldTransparencyValue">
                15%
              </span>

            </div>


            <input
              type="range"
              id="fieldOpacitySlider"
              class="opacity-slider"
              min="0"
              max="100"
              step="1"
              value="15"
            />


            <div class="opacity-labels">

              <span>
                Opaque
              </span>

              <span>
                Transparent
              </span>

            </div>

          </div>


          <!-- ==============================================
               VISUALIZE BY VARIABLES

               Replaces the field boundaries with the fields
               shaded by one variable on one date. Only one of
               the two is drawn at a time.
               ============================================== -->

          <button
            id="visualizeButton"
            type="button"
            aria-pressed="false"
            disabled
          >
            Visualize by variables
          </button>


          <div
            id="visualizeStatus"
            class="empty-state"
            role="status"
          ></div>


          <div
            id="visualizeControls"
            hidden
          >

            <label for="visualizeVariable">
              Variable
            </label>

            <select id="visualizeVariable"></select>


            <div id="visualizePeriodRow">

              <label for="visualizePeriod">
                Time scale
              </label>

              <select id="visualizePeriod"></select>

            </div>


            <div class="opacity-header">

              <span>
                Date
              </span>

              <span id="visualizeDateLabel"></span>

            </div>

            <input
              type="range"
              id="visualizeDate"
              class="opacity-slider"
              aria-label="Date"
              min="0"
              max="0"
              step="1"
              value="0"
            />

            <div class="opacity-labels">

              <span id="visualizeDateMin"></span>

              <span id="visualizeDateMax"></span>

            </div>


            <div
              id="visualizeLegend"
              class="visualize-legend"
            ></div>

          </div>

        </section>


        <!-- ================================================
             RASTERS
             ================================================ -->

        <section class="panel-section">

          <h2>
            Raster Datasets
          </h2>


          <div
            id="rasterList"
            class="layer-list"
          ></div>

        </section>

      </aside>


      <!-- ===================================================
           MAP
           =================================================== -->

      <section id="mapContainer">

        <div id="viewDiv"></div>


        <!-- ================================================
             MAP CONTROLS
             ================================================ -->

        <div id="mapControls">

          <arcgis-search
            id="mapSearch"
          ></arcgis-search>


          <arcgis-compass
            id="mapCompass"
          ></arcgis-compass>

        </div>

      </section>


      <!-- ===================================================
           RIGHT PANEL
           =================================================== -->

      <aside
        id="rightPanel"
        class="side-panel right-panel"
      >

        <!-- ================================================
             RIGHT PANEL RESIZE HANDLE
             ================================================ -->

        <div
          class="resize-handle right-resize-handle"
          id="rightResizeHandle"
          title="Drag to resize"
        ></div>


        <!-- ================================================
             COUNTY REPORT
             ================================================ -->

        <section class="panel-section">

          <h2>
            County Report
          </h2>


          <div
            id="countyReport"
            class="report-content"
            aria-live="polite"
          >

            <div class="empty-state">
              Select a county to view its report.
            </div>

          </div>

        </section>


        <!-- ================================================
             FIELD REPORT

             Same layout as the county report, but kept as its
             own section. Hidden until a field is selected.
             ================================================ -->

        <section
          id="fieldReportSection"
          class="panel-section"
          hidden
        >

          <h2>
            Field Report
          </h2>


          <div
            id="fieldReport"
            class="report-content"
            aria-live="polite"
          ></div>

        </section>


        <!-- ================================================
             FIELD ATTRIBUTES
             ================================================ -->

        <section
          class="panel-section field-info-section"
        >

          <div
            class="section-heading-row"
          >

            <h2>
              Selected Field
            </h2>


            <button
              id="clearFieldButton"
              type="button"
              title="Deselect the field and clear its attributes"
            >
              Clear
            </button>

          </div>


          <div
            id="fieldAttributes"
            class="attribute-container"
          >

            <div class="empty-state">
              Click a field on the map to view its attributes.
            </div>

          </div>

        </section>

      </aside>

    </main>


    <!-- =====================================================
         APPLICATION SCRIPT
         ===================================================== -->

    <script
      type="module"
      src="/src/main.js"
    ></script>

  </body>

</html>
